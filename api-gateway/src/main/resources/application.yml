server:
  port: ${API_GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/auth/**
              filters:
                - RewritePath=/api/auth/(?<segment>.*), /auth/${segment}

            - id: course-service-list
              uri: ${COURSE_SERVICE_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses
              filters:
                - RewritePath=/api/courses, /courses

            - id: course-service-detail
              uri: ${COURSE_SERVICE_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/courses/**
              filters:
                - RewritePath=/api/courses/(?<segment>.*), /courses/${segment}

            - id: registration-service-list
              uri: ${REGISTRATION_SERVICE_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations
              filters:
                - RewritePath=/api/registrations, /registrations

            - id: registration-service-detail
              uri: ${REGISTRATION_SERVICE_BASE_URL:http://localhost:8083}
              predicates:
                - Path=/api/registrations/**
              filters:
                - RewritePath=/api/registrations/(?<segment>.*), /registrations/${segment}

            - id: course-service-partner-list
              uri: ${COURSE_SERVICE_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/public/courses
              filters:
                - RewritePath=/api/public/courses, /courses

            - id: course-service-partner-detail
              uri: ${COURSE_SERVICE_BASE_URL:http://localhost:8082}
              predicates:
                - Path=/api/public/courses/**
              filters:
                - RewritePath=/api/public/courses/(?<segment>.*), /courses/${segment}

            - id: auth-service-api-keys
              uri: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/api-keys,/api/api-keys/**
              filters:
                - RewritePath=/api/api-keys/(?<segment>.*), /api-keys/${segment}
                - RewritePath=/api/api-keys, /api-keys
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowedOrigins: "${FRONTEND_ORIGIN:http://localhost:5173}"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - PATCH
                  - OPTIONS
                allowedHeaders:
                  - "*"



jwt:
  secret: ${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-4-Hoc-Ky-2026-Doi-Trong-Thuc-Te}

auth-service:
  base-url: ${AUTH_SERVICE_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: gateway

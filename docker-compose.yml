services:
  mysql-auth:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: auth_db
    volumes:
      - mysql-auth-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-course:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: course_db
    volumes:
      - mysql-course-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-registration:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: registration_db
    volumes:
      - mysql-registration-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      mysql-auth:
        condition: service_healthy

  course-service:
    build: ./course-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-course:3306/course_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8082:8082"
    depends_on:
      mysql-course:
        condition: service_healthy

  registration-service:
    build: ./registration-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-registration:3306/registration_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      COURSE_SERVICE_BASE_URL: http://course-service:8082
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8083:8083"
    depends_on:
      mysql-registration:
        condition: service_healthy
      course-service:
        condition: service_started

  api-gateway:
    build: ./api-gateway
    environment:
      AUTH_SERVICE_BASE_URL: http://auth-service:8081
      COURSE_SERVICE_BASE_URL: http://course-service:8082
      REGISTRATION_SERVICE_BASE_URL: http://registration-service:8083
      FRONTEND_ORIGIN: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET}
      PARTNER_API_KEY: ${PARTNER_API_KEY:-crs-partner-key-2026}
    ports:
      - "18080:8080"
    depends_on:
      auth-service:
        condition: service_started
      course-service:
        condition: service_started
      registration-service:
        condition: service_started

  crs-frontend:
    build:
      context: ./crs-frontend
      args:
        VITE_API_BASE_URL: http://localhost:18080
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started

volumes:
  mysql-auth-data:
  mysql-course-data:
  mysql-registration-data:

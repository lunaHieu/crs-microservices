spring.application.name=auth-service

server.port=8081

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=CRS-Microservices-Secret-Key-Nam-4-Hoc-Ky-2026-Doi-Trong-Thuc-Te
jwt.expiration-ms=86400000
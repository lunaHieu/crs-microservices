spring.application.name=auth-service

server.port=${AUTH_SERVICE_PORT:8081}

spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:CRS-Microservices-Secret-Key-Nam-4-Hoc-Ky-2026-Doi-Trong-Thuc-Te}
jwt.expiration-ms=${JWT_EXPIRATION:86400000}
